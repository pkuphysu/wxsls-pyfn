name: Test and Lint

on:
  pull_request:
  push:
    paths-ignore:
      - "**.md"

jobs:
  test-and-lint:
    name: test and lint
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_USER: user
          MYSQL_PASSWORD: password
          MYSQL_DATABASE: wechat
        ports:
          - 3306:3306
        # Wait until MySQL accepts authenticated connections.
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: 3.6
      - uses: Gr1N/setup-poetry@v4
        with:
          poetry-version: 1.1.6
      - uses: allanchain/poetry-cache-action@release
        with:
          replace-mirror: pypi.tuna.tsinghua.edu.cn/pypi.org
      - name: Run test
        run: poetry run python scripts/auto_coverage.py
      - name: Upload coverage
        run: bash <(curl -s https://codecov.io/bash)
      - name: Lint with pre-commit
        run: poetry run pre-commit run -a --show-diff-on-failure --color=always
