component: scf
name: pkuphysu-wechat
app: pkuphysu-wechat
stage: ${env:STAGE}
inputs:
  name: ${name}-${stage}
  src:
    src: ./
    exclude:
      - tests/**
      - "*.yml"
      - ".secret*"
  handler: index.main_handler
  region: ap-shanghai
  zone: ap-shanghai-2
  runtime: CustomRuntime
  initTimeout: 10
  timeout: 30
  layers:
    - name: ${env:SCF_LAYER_RUNTIME_NAME}
      version: ${env:SCF_LAYER_RUNTIME_VERSION}
    - name: ${env:SCF_LAYER_PYTHON_NAME}
      version: ${env:SCF_LAYER_PYTHON_VERSION}
  eip: true
  vpcConfig:
    vpcId: ${env:SCF_VPC_ID}
    subnetId: ${env:SCF_SUBNET_ID}
  environment:
    variables:
      DYNACONF_FLASK__SQLALCHEMY_DATABASE_URI: ${env:DYNACONF_FLASK__SQLALCHEMY_DATABASE_URI}
      ENV_FOR_DYNACONF: ${env:DYNACONF_ENV}
  events:
    - apigw:
        parameters:
          serviceName: apigw_${stage}
          protocols:
            - https
          environment: release
          endpoints:
            - path: /
              method: ANY
              enableCORS: true
              function:
                isIntegratedResponse: true
    - timer:
        parameters:
          name: health-check
          cronExpression: "0 */10 * * * * *"
          enable: true
